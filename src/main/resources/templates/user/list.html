<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
	xmlns:layout="http://ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">
<head>
	<title>健康一覧</title>
</head>
<body>
	<div layout:fragment="content">
		<div class="mt-4">
			<h2 class="h2">健康一覧</h2>
			<div class="d-flex justify-content-end">
				<a th:href="@{/user/input/{userId}(userId=${userId})}" class="btn btn-primary">
				新規登録
				</a>
			</div>
			<table class="table table-striped table-bordered table-hover mt-3">
				<thead>
					<tr class="table-primary">
            			<th>No.</th>
            			<th>ユーザーID</th>
            			<th>結果</th>
            			<th>日付</th>
            			<th>詳細</th>
        			</tr>
				</thead>
				<tbody>
        			<tr th:each="healthCheck, stat : ${healthCheckList}">
            			<td th:text="${stat.count}"></td>
						<td th:text="${healthCheck.userId}"></td>
						<td th:text="${healthCheck.result}"></td>
						<td th:text="${healthCheck.checkDate}"></td>
            			<td>
                			<a th:href="@{/user/detail/{healthCheckId}(healthCheckId=${healthCheck.healthCheckId})}">
                    		詳細
                			</a>
            			</td>
        			</tr>
    			</tbody>
			</table>
		</div>
	</div>
</body>
</html>
