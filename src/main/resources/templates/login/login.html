<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- CSS -->
<link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">
<link rel="stylesheet" th:href="@{/css/layout.css}">
<!-- JS -->
<script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}" defer></script>
<title>ログイン</title>
</head>
<body>
	<div class="login-wrapper vh-80">
		<div class="card col-4 bg-light rounded-4">
			<div class="cart-body m-4">
				<form th:action="@{/login}" method="post">
					<h2>ログイン</h2>
					<div class="alert alert-danger mt-3" th:if="${error}" th:text="${error}"></div>
					<div class="form-group mt-4">
						<input type="text" class="form-control input-control" placeholder="ユーザーID" name="userId">
					</div>
					<div class="form-group mt-4 mb-2">
						<input type="password" class="form-control input-control" placeholder="パスワード" name="password">
					</div>
					<input type="submit" value="ログイン" class="btn btn-primary mt-3 mb-2"><br>
					<a th:href="@{/signup}">新規登録はこちら</a>
				</form>
			</div>
		</div>
	</div>
</body>
</html>
